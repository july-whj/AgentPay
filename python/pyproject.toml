[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpay"
version = "0.1.0"
description = "The Open-Source Payment Infrastructure & Financial Firewall for Autonomous AI Agents"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "AgentPay Contributors" }
]
requires-python = ">=3.10"
dependencies = [
    "eth-account>=0.11.0",
    "web3>=6.15.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0"
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110.0"
]
langchain = [
    "langchain-core>=0.1.0"
]
all = [
    "fastapi>=0.110.0",
    "langchain-core>=0.1.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["agentpay"]
